<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日誌 🏖️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 雲端同步用：Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --sea:#3fb6c9;
    --sea-dark:#2a8a9a;
    --sea-light:#cdeff5;
    --mint:#a9e6c8;
    --mint-dark:#4fae82;
    --mint-light:#e3f8ee;
    --sand:#fffaf0;
    --sun:#ffd166;
    --coral:#ff9a76;
    --text:#2d4a4a;
    --text-light:#79a09c;
    --done:#c3d8d5;
    --shadow:0 8px 22px rgba(63,182,201,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Sans TC", sans-serif;
    background:
      radial-gradient(circle at 12% 0%, var(--sea-light) 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, var(--mint-light) 0%, transparent 45%),
      linear-gradient(160deg, var(--sand), #eafcf7 60%, var(--sea-light) 150%);
    color:var(--text);
    padding:22px 14px 100px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;position:relative;}
  h1{
    font-family:"Baloo 2", sans-serif;
    font-size:2.2em;color:var(--sea-dark);margin:0;letter-spacing:1px;
    text-shadow:0 2px 0 #fff;
  }
  .deco{position:absolute;font-size:1.7em;top:-6px;}
  .deco.l1{left:0;}
  .deco.l2{left:44px;top:20px;font-size:1.2em;}
  .deco.r1{right:0;}
  .deco.r2{right:44px;top:20px;font-size:1.2em;}

  .card{
    background:#fff;border-radius:20px;box-shadow:var(--shadow);
    padding:16px 16px 20px;margin-bottom:16px;border:1px solid #d9f2ee;
  }

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;}
  .controls input[type=number], .controls select{
    font-family:inherit;padding:8px 12px;border-radius:14px;
    border:1.5px solid var(--mint-dark);background:#fff;color:var(--text);font-size:1em;
    width:auto;
  }
  .controls input[type=number]{width:90px;}

  .search-row{display:flex;align-items:center;gap:8px;margin-top:12px;
    background:var(--mint-light);border-radius:16px;padding:8px 14px;}
  .search-row span{font-size:1.1em;}
  .search-row input{
    flex:1;border:none;background:transparent;font-family:inherit;font-size:0.95em;
    color:var(--text);outline:none;
  }
  .search-row input::placeholder{color:var(--text-light);}

  .search-results{margin-top:10px;}
  .list-hit{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--sea-light);border-radius:14px;padding:10px 14px;margin-bottom:8px;
    font-size:0.9em;
  }
  .list-hit .info{flex:1;min-width:0;cursor:pointer;}
  .list-hit .date-tag{font-weight:700;color:var(--sea-dark);white-space:nowrap;margin-right:8px;}
  .list-hit .snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-hit .rmd-tag{font-size:0.78em;color:var(--text-light);display:block;margin-top:2px;}
  .list-hit .rmd-tag.overdue{color:var(--coral);font-weight:700;}
  .no-hit{text-align:center;color:var(--text-light);font-size:0.85em;padding:8px;}

  .todo-check{
    width:22px;height:22px;flex:0 0 auto;cursor:pointer;border-radius:50%;
    border:2px solid var(--sea);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;background:#fff;
  }

  .toggle-btn{
    background:linear-gradient(135deg,var(--sea-light),var(--mint-light));
    border:1.5px solid var(--mint-dark);border-radius:16px;padding:7px 16px;color:var(--sea-dark);
    font-weight:700;font-family:inherit;cursor:pointer;font-size:0.85em;
  }
  .toggle-btn.active{background:linear-gradient(135deg,var(--sea),var(--mint-dark));color:#fff;border-color:transparent;}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;}

  /* 月曆快速導覽 */
  .heat-strip{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px;}
  .heat-dot{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mint-dark);
    background:#fff;color:var(--text-light);font-size:0.7em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .heat-dot.has::after{
    content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--sea-dark);
  }
  .heat-dot.today{border-color:var(--sea-dark);border-width:2px;font-weight:700;color:var(--sea-dark);}

  .day-block{border-radius:16px;background:var(--mint-light);padding:14px 16px;margin-bottom:16px;
    border:1px solid #d3f0e3;scroll-margin-top:16px;}
  .day-block.flash{animation:flash 1.2s ease;}
  @keyframes flash{0%,100%{background:var(--mint-light);}30%{background:var(--sun);}}
  .day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .day-head .date-label{font-weight:700;color:var(--sea-dark);}
  .day-head .weekday{font-size:0.8em;color:var(--text-light);margin-left:6px;}
  .day-add{
    background:linear-gradient(135deg,var(--sea),var(--mint-dark));border:none;color:#fff;
    border-radius:50%;width:28px;height:28px;font-size:1.1em;cursor:pointer;line-height:1;
  }
  .day-empty-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 4px 6px 2px;margin-bottom:10px;scroll-margin-top:16px;
  }
  .day-empty-row .date-label{font-weight:700;color:var(--sea-dark);font-size:0.92em;}
  .day-empty-row .weekday{font-size:0.78em;color:var(--text-light);margin-left:6px;}
  .day-empty-row .day-add{width:24px;height:24px;font-size:0.95em;}

  .task{
    background:#fff;border-radius:14px;
    padding:8px 12px;margin-bottom:8px;border:1px solid #e3f3ed;
  }
  .task.done{opacity:0.55;}
  .task.done .task-title{text-decoration:line-through;color:var(--done);}
  .task-top{display:flex;align-items:center;gap:8px;}
  .checkbox{
    width:22px;height:22px;flex:0 0 auto;cursor:pointer;border-radius:50%;
    border:2px solid var(--sea);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;background:#fff;
  }
  .checkbox.checked{background:linear-gradient(135deg,var(--sea),var(--mint-dark));}
  .tag-chip{
    flex:0 0 auto;font-size:0.68em;font-weight:700;color:#fff;padding:2px 8px;
    border-radius:999px;white-space:nowrap;
  }
  .task-title{
    border:none;flex:1;min-width:0;font-family:inherit;font-size:0.95em;font-weight:700;color:var(--text);
    background:transparent;padding:3px 0;
  }
  .task-title:focus{outline:none;border-bottom:1.5px solid var(--mint-dark);}
  .task-title::placeholder{font-weight:400;color:var(--text-light);}
  .bell-wrap{display:flex;flex-direction:column;align-items:center;gap:1px;flex:0 0 auto;}
  .bell-btn{
    width:24px;height:24px;border-radius:50%;border:none;
    background:transparent;color:var(--text-light);font-size:0.95em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;opacity:0.5;
  }
  .bell-btn.set{background:var(--sea-light);color:var(--sea-dark);opacity:1;}
  .bell-badge{font-size:0.6em;color:var(--sea-dark);font-weight:700;white-space:nowrap;}
  .expand-btn{
    background:none;border:none;color:var(--text-light);cursor:pointer;font-size:0.85em;
    padding:2px 4px;flex:0 0 auto;
  }
  .del-btn{background:none;border:none;color:#c7dcd7;cursor:pointer;font-size:1.05em;padding:2px 4px;flex:0 0 auto;}
  .del-btn:hover{color:var(--sea-dark);}
  .empty-hint{color:var(--text-light);font-size:0.82em;padding:2px 0 2px 2px;}

  .task-expand{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed #dfeee9;}
  .task-expand.show{display:block;}
  .tag-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .tag-row .lbl{font-size:0.8em;color:var(--text-light);}
  .tag-row select{
    font-family:inherit;font-size:0.82em;border:1px solid var(--mint-dark);border-radius:10px;
    padding:4px 8px;color:var(--text);background:#fbfffd;flex:1;min-width:0;
  }
  .tag-manage-chip{
    display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
    color:#fff;font-size:0.82em;font-weight:700;
  }
  .task-detail{
    border:none;width:100%;font-family:inherit;font-size:0.85em;
    color:var(--text);background:#fafffd;padding:8px;margin-bottom:8px;
    resize:vertical;min-height:44px;line-height:1.5;border-radius:10px;border:1px solid #eaf6f1;
  }
  .task-detail:focus{outline:none;border-color:var(--mint-dark);}
  .task-detail::placeholder{color:#b9d3cd;}
  .reminder-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;}
  .reminder-row .lbl{font-size:0.8em;color:var(--text-light);}
  .reminder-row input[type=datetime-local]{
    font-family:inherit;font-size:0.78em;border:1px solid var(--mint-dark);border-radius:10px;
    padding:3px 7px;color:var(--text-light);background:#fbfffd;
  }
  .lead-group{display:flex;align-items:center;gap:3px;}
  .lead-group input[type=number]{
    width:44px;font-family:inherit;font-size:0.78em;border:1px solid var(--mint-dark);
    border-radius:10px;padding:3px 5px;color:var(--text-light);background:#fbfffd;text-align:center;
  }
  .lead-group span{font-size:0.78em;color:var(--text-light);}
  .remove-reminder{
    background:none;border:none;color:var(--coral);font-family:inherit;font-size:0.78em;
    cursor:pointer;text-decoration:underline;padding:2px 4px;
  }
  .collapse-link{
    display:block;text-align:center;margin-top:8px;background:none;border:none;
    color:var(--text-light);font-family:inherit;font-size:0.78em;cursor:pointer;
  }

  /* 依案件檢視 */
  .tag-group{margin-bottom:16px;}
  .tag-group-head{
    display:inline-block;font-size:0.85em;font-weight:700;color:#fff;
    padding:4px 12px;border-radius:999px;margin-bottom:8px;
  }

  /* 右下角提醒彈窗 */
  #popupStack{
    position:fixed;right:16px;bottom:16px;z-index:1000;
    display:flex;flex-direction:column;gap:12px;align-items:flex-end;
  }
  .reminder-popup{
    background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(63,182,201,0.35);
    border:2px solid var(--mint-dark);padding:14px 16px;width:280px;
    animation:slideIn .3s ease-out;
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
  .reminder-popup .rp-head{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--sea-dark);margin-bottom:6px;}
  .reminder-popup .rp-text{font-size:0.92em;color:var(--text);margin-bottom:8px;word-break:break-word;}
  .reminder-popup .rp-date{font-size:0.75em;color:var(--text-light);margin-bottom:10px;}
  .reminder-popup .rp-btns{display:flex;gap:8px;}
  .rp-btn{
    flex:1;border:none;border-radius:12px;padding:7px 0;font-family:inherit;font-weight:700;
    font-size:0.85em;cursor:pointer;
  }
  .rp-btn.confirm{background:linear-gradient(135deg,var(--sea),var(--mint-dark));color:#fff;}
  .rp-btn.snooze{background:var(--sea-light);color:var(--sea-dark);}
  .snooze-panel{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--mint-dark);}
  .snooze-panel.show{display:block;}
  .snooze-panel .snooze-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .snooze-panel input[type=number]{
    width:50px;font-family:inherit;font-size:0.85em;border:1px solid var(--mint-dark);
    border-radius:10px;padding:4px 6px;text-align:center;
  }
  .snooze-panel span{font-size:0.82em;color:var(--text-light);}
  .snooze-apply{
    width:100%;background:linear-gradient(135deg,var(--sun),var(--mint));border:none;
    border-radius:12px;padding:6px 0;font-family:inherit;font-weight:700;color:var(--text);
    cursor:pointer;font-size:0.85em;
  }

  footer{text-align:center;color:var(--text-light);font-size:0.75em;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="deco l1">🏄‍♂️</span><span class="deco l2">🕶️</span>
    <h1>工作日誌</h1>
    <span class="deco r2">💪</span><span class="deco r1">🍹</span>
  </header>

  <div class="card">
    <div class="controls">
      <input type="number" id="yearInput" min="2000" max="2100">
      <select id="monthInput"></select>
    </div>
    <div class="search-row">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="搜尋所有月份的工作日誌內容...">
    </div>
    <div class="search-results" id="searchResults"></div>

    <div class="btn-row">
      <button class="toggle-btn" id="todoToggle">📋 顯示待辦提醒清單</button>
      <button class="toggle-btn" id="viewModeToggle">🏷️ 依案件檢視</button>
      <button class="toggle-btn" id="hideDoneToggle">👁️ 只看未完成</button>
      <button class="toggle-btn" id="tagManageToggle">🏷️ 管理標籤</button>
    </div>

    <div class="heat-strip" id="heatStrip"></div>

    <div class="search-row" style="margin-top:14px;">
      <span>☁️</span>
      <input type="text" id="syncCodeInput" placeholder="雲端同步代碼（兩台裝置輸入同一組即可同步）">
      <button class="toggle-btn" id="syncApplyBtn" style="padding:6px 12px;">套用</button>
    </div>
    <div id="syncStatus" style="text-align:center;font-size:0.75em;color:var(--text-light);margin-top:6px;"></div>
  </div>

  <div class="card" id="tagManageCard" style="display:none;">
    <div style="text-align:center;font-weight:700;color:var(--sea-dark);margin-bottom:8px;">🏷️ 標籤管理</div>
    <div class="search-row" style="margin-bottom:12px;">
      <span>＋</span>
      <input type="text" id="newTagInput" placeholder="輸入新的標籤名稱，例如案名／客戶名稱">
      <button class="toggle-btn" id="addTagBtn" style="padding:6px 12px;">新增</button>
    </div>
    <div id="tagChipList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>

  <div class="card" id="allTodoCard" style="display:none;">
    <div style="text-align:center;font-weight:700;color:var(--sea-dark);margin-bottom:8px;" id="allTodoTitle">📋 待辦提醒清單</div>
    <div id="allTodoList"></div>
  </div>

  <div id="monthView"></div>
  <div id="tagView" style="display:none;"></div>

  <footer>資料預設存在本機瀏覽器；輸入雲端同步代碼並完成 Firebase 設定後即可跨裝置同步</footer>
</div>

<div id="popupStack"></div>

<script>
const LS_KEY = 'worklog_data_v1';
const UPDATED_KEY = 'worklog_updated_at';
const SYNC_KEY = 'worklog_sync_code';
let data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
let curYear, curMonth;
let showAllTodo = false;
let viewMode = 'date'; // 'date' | 'tag'
let hideDone = false;
const activePopupIds = new Set();
const expandedTaskIds = new Set();
const weekdays = ['日','一','二','三','四','五','六'];
const TAG_COLORS = ['#3fb6c9','#4fae82','#e0a951','#ba68c8','#ec6f8e','#7986cb','#8d6e63','#4db6ac'];
const TAGS_KEY = 'worklog_tags';
let tagList = JSON.parse(localStorage.getItem(TAGS_KEY) || '[]');
function saveTags(){ localStorage.setItem(TAGS_KEY, JSON.stringify(tagList)); }
function getAllTags(){
  const set = new Set(tagList);
  Object.values(data).forEach(monthData=>{
    Object.values(monthData).forEach(arr=>{
      arr.forEach(t=>{ if(t.tag) set.add(t.tag); });
    });
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}
function renderTagManage(){
  const box = document.getElementById('tagChipList');
  box.innerHTML='';
  const tags = getAllTags();
  if(tags.length===0){
    box.innerHTML = '<div class="no-hit">還沒有任何標籤，先新增一個看看吧</div>';
    return;
  }
  tags.forEach(tag=>{
    const chip = document.createElement('div');
    chip.className='tag-manage-chip';
    chip.style.background = tagColor(tag);
    const label = document.createElement('span');
    label.textContent = tag;
    const delBtn = document.createElement('span');
    delBtn.textContent='✕'; delBtn.style.cursor='pointer'; delBtn.style.opacity='0.85';
    delBtn.title = '從快速選單移除（不會刪掉已經標記的項目）';
    delBtn.onclick = ()=>{
      tagList = tagList.filter(t=>t!==tag);
      saveTags();
      renderTagManage();
    };
    chip.appendChild(label);
    chip.appendChild(delBtn);
    box.appendChild(chip);
  });
}

/* ============ 雲端同步設定區 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBw-UXlYDlJwK3zJxraQmWnj5eZe5lmPuU",
  authDomain: "my-worklog-970a5.firebaseapp.com",
  projectId: "my-worklog-970a5",
  storageBucket: "my-worklog-970a5.firebasestorage.app",
  messagingSenderId: "277968948235",
  appId: "1:277968948235:web:74dc9dff9ec6ff88704b0e"
};

let cloudEnabled = false;
let db = null;
let syncCode = localStorage.getItem(SYNC_KEY) || '';
let pushTimer = null;

try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('貼上') === -1){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    cloudEnabled = true;
  }
}catch(e){ console.error('Firebase 初始化失敗', e); }

function setSyncStatus(msg){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = msg;
}

function pushToCloud(){
  if(!cloudEnabled || !syncCode) return;
  const updatedAt = Date.now();
  localStorage.setItem(UPDATED_KEY, String(updatedAt));
  db.collection('worklogs').doc(syncCode).set({ json: JSON.stringify(data), updatedAt })
    .then(()=> setSyncStatus('☁️ 已同步'))
    .catch(e=>{ console.error(e); setSyncStatus('⚠️ 同步失敗，請確認 Firebase 設定'); });
}

function initSync(){
  if(!cloudEnabled){
    setSyncStatus('⚠️ 尚未完成 Firebase 設定，目前只會存在本機');
    return;
  }
  if(!syncCode){
    setSyncStatus('請輸入同步代碼並按套用');
    return;
  }
  setSyncStatus('🔄 同步中...');
  db.collection('worklogs').doc(syncCode).get().then(doc=>{
    const localUpdated = Number(localStorage.getItem(UPDATED_KEY)||0);
    if(doc.exists){
      const cloud = doc.data();
      if((cloud.updatedAt||0) > localUpdated){
        data = JSON.parse(cloud.json || '{}');
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        localStorage.setItem(UPDATED_KEY, String(cloud.updatedAt||0));
        refreshAll();
      } else {
        pushToCloud();
      }
    } else {
      pushToCloud();
    }
    setSyncStatus('☁️ 已連上雲端，此裝置代碼：' + syncCode);
    db.collection('worklogs').doc(syncCode).onSnapshot(snap=>{
      if(!snap.exists) return;
      const cloud = snap.data();
      const localUpdated2 = Number(localStorage.getItem(UPDATED_KEY)||0);
      if((cloud.updatedAt||0) > localUpdated2 + 1000){
        data = JSON.parse(cloud.json || '{}');
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        localStorage.setItem(UPDATED_KEY, String(cloud.updatedAt||0));
        refreshAll();
        setSyncStatus('☁️ 已從其他裝置同步最新資料');
      }
    });
  }).catch(e=>{
    console.error(e);
    setSyncStatus('⚠️ 連線失敗，請確認 Firebase 設定與網路');
  });
}

function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  localStorage.setItem(UPDATED_KEY, String(Date.now()));
  if(cloudEnabled && syncCode){
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToCloud, 800);
  }
}

function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function ensureMonth(key){ if(!data[key]) data[key]={}; return data[key]; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function pad(n){ return String(n).padStart(2,'0'); }
function toDatetimeLocal(date){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function triggerAt(task){
  if(!task.eventAt) return null;
  const base = new Date(task.eventAt);
  const leadMin = (Number(task.leadH)||0)*60 + (Number(task.leadM)||0);
  base.setMinutes(base.getMinutes() - leadMin);
  return base;
}
function tagColor(tag){
  if(!tag) return '#b7c9c5';
  let h=0; for(let i=0;i<tag.length;i++) h = (h*31 + tag.charCodeAt(i)) >>> 0;
  return TAG_COLORS[h % TAG_COLORS.length];
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initControls(){
  const now = new Date();
  curYear = now.getFullYear();
  curMonth = now.getMonth()+1;
  document.getElementById('yearInput').value = curYear;
  const monthSel = document.getElementById('monthInput');
  for(let m=1;m<=12;m++){
    const opt = document.createElement('option');
    opt.value=m; opt.textContent = m+'月';
    if(m===curMonth) opt.selected=true;
    monthSel.appendChild(opt);
  }
  document.getElementById('yearInput').addEventListener('change', e=>{
    curYear = Number(e.target.value)||now.getFullYear();
    refreshAll();
  });
  monthSel.addEventListener('change', e=>{
    curMonth = Number(e.target.value);
    refreshAll();
  });
}

function refreshAll(){
  if(viewMode==='date'){
    renderMonth();
    renderHeatStrip();
  } else {
    renderTagView();
  }
  if(showAllTodo) renderAllTodos();
  const q = document.getElementById('searchInput').value;
  if(q.trim()) runSearch(q);
}

/* ---------- 日期檢視 ---------- */
function renderMonth(){
  const key = monthKey(curYear, curMonth);
  const monthData = ensureMonth(key);
  const dim = daysInMonth(curYear, curMonth);
  const view = document.getElementById('monthView');
  view.innerHTML = '';
  for(let d=1; d<=dim; d++){
    let tasks = monthData[d] || [];
    if(hideDone) tasks = tasks.filter(t=>!t.done);
    const wd = new Date(curYear, curMonth-1, d).getDay();

    if(tasks.length===0){
      const row = document.createElement('div');
      row.className = 'day-empty-row';
      row.id = `day-${curYear}-${curMonth}-${d}`;
      row.innerHTML = `<div><span class="date-label">${curMonth}/${d}</span><span class="weekday">星期${weekdays[wd]}</span></div>`;
      const addBtn = document.createElement('button');
      addBtn.className='day-add'; addBtn.textContent='＋';
      addBtn.onclick = ()=>{
        if(!monthData[d]) monthData[d]=[];
        monthData[d].push({id:Date.now()+Math.random(), text:'', detail:'', tag:'', done:false, eventAt:'', leadH:0, leadM:0, reminderDone:false});
        save(); refreshAll();
      };
      row.appendChild(addBtn);
      view.appendChild(row);
      continue;
    }

    const block = document.createElement('div');
    block.className = 'day-block';
    block.id = `day-${curYear}-${curMonth}-${d}`;

    const head = document.createElement('div');
    head.className = 'day-head';
    const label = document.createElement('div');
    label.innerHTML = `<span class="date-label">${curMonth}/${d}</span><span class="weekday">星期${weekdays[wd]}</span>`;
    const addBtn = document.createElement('button');
    addBtn.className = 'day-add';
    addBtn.textContent = '＋';
    addBtn.onclick = ()=>{
      monthData[d].push({id:Date.now()+Math.random(), text:'', detail:'', tag:'', done:false, eventAt:'', leadH:0, leadM:0, reminderDone:false});
      save(); refreshAll();
    };
    head.appendChild(label);
    head.appendChild(addBtn);
    block.appendChild(head);

    tasks.forEach(task=> block.appendChild(renderTaskRow(task, monthData[d], task, curYear, curMonth, d)));
    view.appendChild(block);
  }
}

function formatBellBadge(eventAt){
  if(!eventAt) return '';
  const [datePart, timePart] = eventAt.split('T');
  const [y,m,dd] = datePart.split('-');
  return `${Number(m)}/${Number(dd)} ${timePart||''}`;
}

function renderTaskRow(task, arr){
  const row = document.createElement('div');
  row.className = 'task' + (task.done?' done':'');

  const top = document.createElement('div');
  top.className = 'task-top';

  const cb = document.createElement('div');
  cb.className = 'checkbox' + (task.done?' checked':'');
  cb.textContent = task.done ? '✓' : '';
  cb.onclick = ()=>{ task.done=!task.done; save(); refreshAll(); };
  top.appendChild(cb);

  let tagChip = null;
  if(task.tag){
    tagChip = document.createElement('span');
    tagChip.className='tag-chip';
    tagChip.style.background = tagColor(task.tag);
    tagChip.textContent = task.tag;
    top.appendChild(tagChip);
  }

  const title = document.createElement('input');
  title.className='task-title';
  title.value = task.text || '';
  title.placeholder='專案／任務名稱...';
  title.oninput = ()=>{ task.text = title.value; save(); if(showAllTodo) renderAllTodos(); };
  top.appendChild(title);

  const bellWrap = document.createElement('div');
  bellWrap.className='bell-wrap';
  const bellBtn = document.createElement('button');
  bellBtn.className='bell-btn';
  bellBtn.textContent='🔔';
  const bellBadge = document.createElement('span');
  bellBadge.className='bell-badge';
  function updateBell(){
    if(task.eventAt){
      bellBtn.classList.add('set');
      bellBadge.textContent = formatBellBadge(task.eventAt);
    } else {
      bellBtn.classList.remove('set');
      bellBadge.textContent = '';
    }
  }
  updateBell();
  bellWrap.appendChild(bellBtn); bellWrap.appendChild(bellBadge);
  top.appendChild(bellWrap);

  const expandBtn = document.createElement('button');
  expandBtn.className='expand-btn';
  top.appendChild(expandBtn);

  const del = document.createElement('button');
  del.className='del-btn'; del.textContent='✕';
  del.onclick = ()=>{
    arr.splice(arr.indexOf(task),1);
    save(); refreshAll();
  };
  top.appendChild(del);

  row.appendChild(top);

  // 展開區：標籤 / 細節 / 提醒設定
  const expand = document.createElement('div');
  expand.className = 'task-expand';

  const tagRow = document.createElement('div');
  tagRow.className = 'tag-row';
  const tagLbl = document.createElement('span'); tagLbl.className='lbl'; tagLbl.textContent='🏷️ 標籤：';
  const tagSelect = document.createElement('select');
  const noneOpt = document.createElement('option'); noneOpt.value=''; noneOpt.textContent='（不分類）';
  tagSelect.appendChild(noneOpt);
  getAllTags().forEach(tagName=>{
    const opt = document.createElement('option');
    opt.value = tagName; opt.textContent = tagName;
    if(task.tag === tagName) opt.selected = true;
    tagSelect.appendChild(opt);
  });
  const newOpt = document.createElement('option'); newOpt.value='__new__'; newOpt.textContent='＋ 新增標籤...';
  tagSelect.appendChild(newOpt);
  if(!task.tag) noneOpt.selected = true;
  tagSelect.onchange = ()=>{
    if(tagSelect.value === '__new__'){
      const name = prompt('請輸入新的標籤名稱：');
      if(name && name.trim()){
        const t = name.trim();
        if(!tagList.includes(t)) tagList.push(t);
        saveTags();
        task.tag = t;
        if(typeof showTagManage !== 'undefined' && showTagManage) renderTagManage();
      }
      save(); refreshAll();
      return;
    }
    task.tag = tagSelect.value;
    save(); refreshAll();
  };
  tagRow.appendChild(tagLbl); tagRow.appendChild(tagSelect);
  expand.appendChild(tagRow);

  const detail = document.createElement('textarea');
  detail.className='task-detail';
  detail.rows = 2;
  detail.value = task.detail || '';
  detail.placeholder='細節、備註...';
  detail.oninput = ()=>{ task.detail = detail.value; save(); };
  expand.appendChild(detail);

  const remRow = document.createElement('div');
  remRow.className='reminder-row';
  const remLbl = document.createElement('span'); remLbl.className='lbl'; remLbl.textContent='🔔 提醒時間：';
  const dt = document.createElement('input');
  dt.type='datetime-local';
  dt.value = task.eventAt || '';
  dt.onchange = ()=>{
    task.eventAt = dt.value;
    task.reminderDone = false;
    activePopupIds.delete(String(task.id));
    save(); updateBell();
  };
  const leadLbl = document.createElement('span'); leadLbl.className='lbl'; leadLbl.textContent='提前';
  const leadGroup = document.createElement('div');
  leadGroup.className='lead-group';
  const leadH = document.createElement('input');
  leadH.type='number'; leadH.min='0'; leadH.value = task.leadH||0;
  leadH.onchange = ()=>{ task.leadH = Number(leadH.value)||0; task.reminderDone=false; activePopupIds.delete(String(task.id)); save(); updateBell(); };
  const hSpan = document.createElement('span'); hSpan.textContent='小時';
  const leadM = document.createElement('input');
  leadM.type='number'; leadM.min='0'; leadM.max='59'; leadM.value = task.leadM||0;
  leadM.onchange = ()=>{ task.leadM = Number(leadM.value)||0; task.reminderDone=false; activePopupIds.delete(String(task.id)); save(); updateBell(); };
  const mSpan = document.createElement('span'); mSpan.textContent='分鐘';
  leadGroup.appendChild(leadH); leadGroup.appendChild(hSpan);
  leadGroup.appendChild(leadM); leadGroup.appendChild(mSpan);
  const removeBtn = document.createElement('button');
  removeBtn.className='remove-reminder';
  removeBtn.textContent='移除提醒';
  removeBtn.onclick = ()=>{
    task.eventAt=''; task.leadH=0; task.leadM=0; task.reminderDone=false;
    activePopupIds.delete(String(task.id));
    dt.value=''; leadH.value=0; leadM.value=0;
    save(); updateBell();
  };
  remRow.appendChild(remLbl); remRow.appendChild(dt);
  remRow.appendChild(leadLbl); remRow.appendChild(leadGroup);
  remRow.appendChild(removeBtn);
  expand.appendChild(remRow);

  const collapseLink = document.createElement('button');
  collapseLink.className='collapse-link';
  collapseLink.textContent='▲ 收合';
  collapseLink.onclick = ()=> setExpanded(false);
  expand.appendChild(collapseLink);

  row.appendChild(expand);

  function setExpanded(v){
    if(v){ expandedTaskIds.add(String(task.id)); expandBtn.textContent='▾'; }
    else { expandedTaskIds.delete(String(task.id)); expandBtn.textContent='▸'; }
    expand.classList.toggle('show', v);
  }
  const initiallyOpen = expandedTaskIds.has(String(task.id));
  expand.classList.toggle('show', initiallyOpen);
  expandBtn.textContent = initiallyOpen ? '▾' : '▸';
  expandBtn.onclick = ()=> setExpanded(!expandedTaskIds.has(String(task.id)));
  bellBtn.onclick = ()=> setExpanded(!expandedTaskIds.has(String(task.id)));

  return row;
}

/* ---------- 月曆快速導覽 ---------- */
function renderHeatStrip(){
  const strip = document.getElementById('heatStrip');
  strip.innerHTML = '';
  const key = monthKey(curYear, curMonth);
  const monthData = data[key] || {};
  const dim = daysInMonth(curYear, curMonth);
  const now = new Date();
  const isCurMonth = now.getFullYear()===curYear && (now.getMonth()+1)===curMonth;
  for(let d=1; d<=dim; d++){
    const dot = document.createElement('div');
    dot.className = 'heat-dot';
    if(monthData[d] && monthData[d].length>0) dot.classList.add('has');
    if(isCurMonth && d===now.getDate()) dot.classList.add('today');
    dot.textContent = d;
    dot.onclick = ()=>{
      const target = document.getElementById(`day-${curYear}-${curMonth}-${d}`);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.classList.add('flash');
        setTimeout(()=>target.classList.remove('flash'), 1200);
      }
    };
    strip.appendChild(dot);
  }
}

/* ---------- 依案件檢視 ---------- */
function renderTagView(){
  const view = document.getElementById('tagView');
  view.innerHTML = '';
  const groups = {};
  Object.keys(data).sort().forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    const monthData = data[key];
    Object.keys(monthData).map(Number).sort((a,b)=>a-b).forEach(d=>{
      monthData[d].forEach(task=>{
        if(hideDone && task.done) return;
        const g = task.tag || '未分類';
        if(!groups[g]) groups[g]=[];
        groups[g].push({y,m,d,task,arr:monthData[d]});
      });
    });
  });
  const tagNames = Object.keys(groups).sort((a,b)=>{
    if(a==='未分類') return 1;
    if(b==='未分類') return -1;
    return a.localeCompare(b);
  });
  if(tagNames.length===0){
    const none = document.createElement('div');
    none.className='card';
    none.innerHTML = '<div class="no-hit">目前沒有符合條件的項目</div>';
    view.appendChild(none);
    return;
  }
  tagNames.forEach(tag=>{
    const wrap = document.createElement('div');
    wrap.className='card tag-group';
    const head = document.createElement('div');
    head.className='tag-group-head';
    head.style.background = tag==='未分類' ? '#b7c9c5' : tagColor(tag);
    head.textContent = `${tag}（${groups[tag].length}）`;
    wrap.appendChild(head);
    groups[tag].forEach(item=>{
      const el = document.createElement('div');
      el.className='list-hit';
      const cb = document.createElement('div');
      cb.className='todo-check';
      if(item.task.done){ cb.style.background='linear-gradient(135deg,var(--sea),var(--mint-dark))'; cb.textContent='✓'; cb.style.color='#fff'; cb.style.fontSize='11px'; cb.style.display='flex'; cb.style.alignItems='center'; cb.style.justifyContent='center'; }
      cb.onclick = ()=>{ item.task.done=!item.task.done; save(); refreshAll(); };
      const info = document.createElement('div');
      info.className='info';
      info.innerHTML = `<span class="date-tag">${item.y}/${item.m}/${item.d}</span><span class="snippet">${escapeHtml(item.task.text||'（未命名項目）')}</span>`;
      info.onclick = ()=>{ viewMode='date'; setActiveViewButtons(); jumpTo(item.y,item.m,item.d); };
      el.appendChild(cb); el.appendChild(info);
      wrap.appendChild(el);
    });
    view.appendChild(wrap);
  });
}

function setActiveViewButtons(){
  document.getElementById('monthView').style.display = viewMode==='date' ? 'block':'none';
  document.getElementById('heatStrip').style.display = viewMode==='date' ? 'flex':'none';
  document.getElementById('tagView').style.display = viewMode==='tag' ? 'block':'none';
  document.getElementById('viewModeToggle').textContent = viewMode==='date' ? '🏷️ 依案件檢視' : '📅 依日期檢視';
  document.getElementById('viewModeToggle').classList.toggle('active', viewMode==='tag');
}

function jumpTo(y,m,d){
  curYear=y; curMonth=m;
  document.getElementById('yearInput').value=curYear;
  document.getElementById('monthInput').value=curMonth;
  renderMonth();
  renderHeatStrip();
  setTimeout(()=>{
    const target = document.getElementById(`day-${y}-${m}-${d}`);
    if(target){
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.add('flash');
      setTimeout(()=>target.classList.remove('flash'), 1200);
    }
  }, 50);
}

/* ---------- 搜尋 ---------- */
function runSearch(q){
  const resultsBox = document.getElementById('searchResults');
  resultsBox.innerHTML = '';
  if(!q.trim()) return;
  const lower = q.toLowerCase();
  const hits = [];
  Object.keys(data).sort().reverse().forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    const monthData = data[key];
    Object.keys(monthData).map(Number).sort((a,b)=>a-b).forEach(d=>{
      monthData[d].forEach(task=>{
        const inTitle = task.text && task.text.toLowerCase().includes(lower);
        const inDetail = task.detail && task.detail.toLowerCase().includes(lower);
        if(inTitle || inDetail){
          hits.push({y,m,d,task});
        }
      });
    });
  });
  if(hits.length===0){
    const none = document.createElement('div');
    none.className='no-hit';
    none.textContent='沒有找到符合的紀錄';
    resultsBox.appendChild(none);
    return;
  }
  hits.forEach(hit=>{
    const el = document.createElement('div');
    el.className='list-hit';
    const info = document.createElement('div');
    info.className='info';
    info.innerHTML = `<span class="date-tag">${hit.y}/${hit.m}/${hit.d}</span><span class="snippet">${escapeHtml(hit.task.text)}</span>`;
    info.onclick = ()=>{ viewMode='date'; setActiveViewButtons(); jumpTo(hit.y,hit.m,hit.d); };
    el.appendChild(info);
    resultsBox.appendChild(el);
  });
}

/* ---------- 待辦提醒清單（只列有設提醒時間、未完成的） ---------- */
function renderAllTodos(){
  const listBox = document.getElementById('allTodoList');
  listBox.innerHTML = '';
  const items = [];
  Object.keys(data).sort().forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    const monthData = data[key];
    Object.keys(monthData).map(Number).sort((a,b)=>a-b).forEach(d=>{
      monthData[d].forEach(task=>{
        if(!task.done && task.eventAt) items.push({y,m,d,task});
      });
    });
  });
  items.sort((a,b)=> new Date(a.task.eventAt) - new Date(b.task.eventAt));
  document.getElementById('allTodoTitle').textContent = `📋 待辦提醒清單（${items.length}）`;
  if(items.length===0){
    const none = document.createElement('div');
    none.className='no-hit';
    none.textContent='目前沒有設定提醒的待辦事項';
    listBox.appendChild(none);
    return;
  }
  const now = new Date();
  items.forEach(item=>{
    const el = document.createElement('div');
    el.className='list-hit';

    const cb = document.createElement('div');
    cb.className='todo-check';
    cb.onclick = ()=>{ item.task.done=true; save(); refreshAll(); };

    const info = document.createElement('div');
    info.className='info';
    const trig = triggerAt(item.task);
    const isOverdue = trig && trig <= now && !item.task.reminderDone;
    const leadText = (item.task.leadH||item.task.leadM) ? `（提前 ${item.task.leadH||0} 小時 ${item.task.leadM||0} 分鐘）` : '';
    const rmdHtml = `<span class="rmd-tag${isOverdue?' overdue':''}">🔔 ${item.task.eventAt.replace('T',' ')}${leadText}${isOverdue?'　⚠️ 已到提醒時間':''}</span>`;
    info.innerHTML = `<span class="date-tag">${item.y}/${item.m}/${item.d}</span><span class="snippet">${escapeHtml(item.task.text||'（未命名項目）')}</span>${rmdHtml}`;
    info.onclick = ()=>{ viewMode='date'; setActiveViewButtons(); jumpTo(item.y,item.m,item.d); };

    el.appendChild(cb);
    el.appendChild(info);
    listBox.appendChild(el);
  });
}

/* ---------- 提醒彈窗 ---------- */
function findAllTasksFlat(){
  const flat = [];
  Object.keys(data).forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    const monthData = data[key];
    Object.keys(monthData).map(Number).forEach(d=>{
      monthData[d].forEach(task=> flat.push({y,m,d,task}));
    });
  });
  return flat;
}

function checkReminders(){
  const now = new Date();
  findAllTasksFlat().forEach(item=>{
    const t = item.task;
    if(!t.eventAt || t.reminderDone || t.done) return;
    if(activePopupIds.has(String(t.id))) return;
    const trig = triggerAt(t);
    if(trig && trig <= now){
      activePopupIds.add(String(t.id));
      showPopup(item);
    }
  });
}

function showPopup(item){
  const t = item.task;
  const stack = document.getElementById('popupStack');
  const pop = document.createElement('div');
  pop.className='reminder-popup';
  pop.innerHTML = `
    <div class="rp-head">🔔 工作提醒</div>
    <div class="rp-text">${escapeHtml(t.text || '（未命名項目）')}</div>
    <div class="rp-date">📅 ${item.y}/${item.m}/${item.d}　⏰ ${(t.eventAt||'').replace('T',' ')}</div>
    <div class="rp-btns">
      <button class="rp-btn confirm">✅ 好，知道了</button>
      <button class="rp-btn snooze">⏳ 延後提醒</button>
    </div>
    <div class="snooze-panel">
      <div class="snooze-row">
        <input type="number" class="snooze-h" min="0" value="0"><span>小時</span>
        <input type="number" class="snooze-m" min="0" max="59" value="10"><span>分鐘後再提醒</span>
      </div>
      <button class="snooze-apply">套用延後</button>
    </div>
  `;
  pop.querySelector('.confirm').onclick = ()=>{
    t.reminderDone = true;
    save();
    stack.removeChild(pop);
    activePopupIds.delete(String(t.id));
    refreshAll();
  };
  pop.querySelector('.snooze').onclick = ()=>{
    pop.querySelector('.snooze-panel').classList.toggle('show');
  };
  pop.querySelector('.snooze-apply').onclick = ()=>{
    const h = Number(pop.querySelector('.snooze-h').value)||0;
    const m = Number(pop.querySelector('.snooze-m').value)||0;
    const delayMin = h*60+m;
    const newTime = new Date(Date.now() + delayMin*60000);
    t.eventAt = toDatetimeLocal(newTime);
    t.leadH = 0; t.leadM = 0;
    t.reminderDone = false;
    save();
    stack.removeChild(pop);
    activePopupIds.delete(String(t.id));
    refreshAll();
  };
  stack.appendChild(pop);
}

initControls();
renderMonth();
renderHeatStrip();
initSync();
setInterval(checkReminders, 15000);
checkReminders();
</script>
</body>
</html>
